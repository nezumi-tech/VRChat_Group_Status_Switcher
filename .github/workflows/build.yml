name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Executables
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 1. Framework-dependent Single File Build (Lightweight ~700KB, requires .NET 10 Desktop Runtime)
      - name: Publish Lightweight Single-File App
        run: |
          dotnet publish VRCGroupSwitcher/VRCGroupSwitcher.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o ./publish-lightweight

      # 2. Self-contained Single File Build (Standalone, runtime included)
      - name: Publish Standalone Single-File App
        run: |
          dotnet publish VRCGroupSwitcher/VRCGroupSwitcher.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o ./publish-standalone

      - name: Create ZIP Archives
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish-lightweight/* -DestinationPath ./VRCGroupSwitcher-win-x64.zip
          Compress-Archive -Path ./publish-standalone/* -DestinationPath ./VRCGroupSwitcher-win-x64-standalone.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VRCGroupSwitcher-binaries
          path: |
            VRCGroupSwitcher-win-x64.zip
            VRCGroupSwitcher-win-x64-standalone.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VRCGroupSwitcher-win-x64.zip
            VRCGroupSwitcher-win-x64-standalone.zip
          generate_release_notes: true
