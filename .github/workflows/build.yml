name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single-File App
        run: |
          dotnet publish VRCGroupSwitcher/VRCGroupSwitcher.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o ./publish

      - name: Create ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./VRCGroupSwitcher-win-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRCGroupSwitcher-win-x64
          path: VRCGroupSwitcher-win-x64.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VRCGroupSwitcher-win-x64.zip
          generate_release_notes: true
